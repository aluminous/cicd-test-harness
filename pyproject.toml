[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cicd-test-harness"
version = "0.1.0"
description = "Ephemeral Kubernetes CI/CD integration-test harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.11,<1",
]

[project.scripts]
cicd-harness = "cicd_harness.cli:main"

[project.entry-points.pytest11]
cicd-harness = "cicd_harness.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/cicd_harness"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "poc: requires a local container runtime and creates ephemeral infrastructure",
]

[tool.ruff]
extend-exclude = [".tools"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
