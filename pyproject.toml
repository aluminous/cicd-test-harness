[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cicd-test-harness"
version = "0.1.0"
description = "Ephemeral Kubernetes CI/CD integration-test harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "vendor/LICENSES/*"]
authors = [{ name = "Austin Brown" }]
requires-python = ">=3.11"
keywords = ["pytest", "kubernetes", "ci-cd", "integration-testing", "kind"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pytest>=8.3,<9",
  "pytest-timeout>=2.3,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11,<1",
]

[project.scripts]
cicd-harness = "cicd_harness.cli:main"

[project.urls]
Homepage = "https://github.com/aluminous/cicd-test-harness"
Repository = "https://github.com/aluminous/cicd-test-harness"
Issues = "https://github.com/aluminous/cicd-test-harness/issues"
Changelog = "https://github.com/aluminous/cicd-test-harness/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
cicd-harness = "cicd_harness.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/cicd_harness"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "cicd_harness/_assets/profiles"
"manifests" = "cicd_harness/_assets/manifests"
"vendor" = "cicd_harness/_assets/vendor"
"images" = "cicd_harness/_assets/images"
"fixtures" = "cicd_harness/_assets/fixtures"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "poc: requires a local container runtime and creates ephemeral infrastructure",
]

[tool.ruff]
extend-exclude = [".tools"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
