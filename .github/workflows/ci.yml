name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install development dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check src tests

      - name: Run fast tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: uv build

      - name: Smoke-test installed wheel assets
        if: matrix.python-version == '3.11'
        run: |
          uv venv /tmp/cicd-harness-smoke --python ${{ matrix.python-version }}
          uv pip install --python /tmp/cicd-harness-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/cicd-harness-smoke/bin/cicd-harness profile show modern
          /tmp/cicd-harness-smoke/bin/cicd-harness endpoints modern --components wiremock,gitea
