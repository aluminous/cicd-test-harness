apiVersion: v1
kind: Namespace
metadata:
  name: harness-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock
  namespace: harness-system
  labels:
    app.kubernetes.io/name: wiremock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wiremock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wiremock
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.13.1
          args:
            - --global-response-templating
            - --disable-gzip
            - --max-request-journal-entries
            - "__WIREMOCK_MAX_REQUEST_JOURNAL_ENTRIES__"
            - --logged-response-body-size-limit
            - "__WIREMOCK_LOGGED_RESPONSE_BODY_SIZE_LIMIT__"
            - --proxy-timeout
            - "__WIREMOCK_PROXY_TIMEOUT_MILLISECONDS__"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wiremock
  namespace: harness-system
spec:
  selector:
    app.kubernetes.io/name: wiremock
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: scanner-mock
  namespace: harness-system
spec:
  selector:
    app.kubernetes.io/name: wiremock
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: harness-system
  labels:
    app.kubernetes.io/name: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gitea
          image: docker.gitea.com/gitea:1.26.4-rootless
          env:
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__database__PATH
              value: /var/lib/gitea/data/gitea.db
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__server__DOMAIN
              value: gitea.harness-system.svc.cluster.local
            - name: GITEA__server__ROOT_URL
              value: http://gitea.harness-system.svc.cluster.local:3000/
            - name: GITEA__server__HTTP_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: config
              mountPath: /etc/gitea
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: harness-system
spec:
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
